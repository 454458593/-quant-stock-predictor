[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-stock-predictor"
version = "0.1.0"
description = "Time-series-safe stock prediction and backtesting for US and A-share tickers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.18.94",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
quant-stock-predict = "quant_stock_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
